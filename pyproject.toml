[project]
name = "cykelstaden"
version = "1.0.0"
description = "ETL-pipeline i Databricks över Citi Bike-data och en app där man ställer frågor på svenska"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]
builtins = ["spark", "dbutils", "display"]  # globaler i Databricks-notebooks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # svenska tecken och typografiska tankstreck i text

[tool.ruff.lint.per-file-ignores]
"app/style.py" = ["E501"]           # CSS
"app/schema_context.py" = ["E501"]  # prompttext
"src/pipeline/*" = ["E402"]         # notebooks har importer i senare celler
