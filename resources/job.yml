resources:
  jobs:
    cykelstaden_etl:
      name: cykelstaden-etl
      description: Bronze (COPY INTO) -> Silver (MERGE) -> Gold för Citi Bike-data
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: months
          default: ${var.months}
        - name: full_refresh
          default: "false" # "true" bygger om bronze och silver från rådatafilerna
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/pipeline/01_bronze_ingest.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/pipeline/02_silver_clean.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/pipeline/03_gold_aggregate.py
